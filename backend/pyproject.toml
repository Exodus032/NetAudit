[project]
name = "netaudit"
version = "1.0.0"
description = "Local network auditing and security tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "psutil==7.2.2",
    'scapy==2.7.0; platform_system == "Windows"',
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
